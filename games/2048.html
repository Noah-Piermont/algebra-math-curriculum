<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>2048</title>
<style>
:root{--bg:#1f2a37;--cell:#2d3b4d;--text:#f4efe6}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
font-family:"Trebuchet MS",Verdana,sans-serif;padding:16px;overscroll-behavior:none}
.wrap{width:min(92vw,440px)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
h1{font:900 44px "Arial Black",Impact,sans-serif;color:#ffd23f}
.scores{display:flex;gap:8px}
.box{background:var(--cell);border-radius:8px;padding:6px 12px;text-align:center;min-width:70px}
.box small{display:block;font-size:11px;opacity:.7}
.box b{font-size:20px;font-variant-numeric:tabular-nums}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;opacity:.9}
button{background:#ffd23f;color:#1f2a37;border:0;border-radius:8px;padding:10px 16px;font:700 15px inherit;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#board{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#16202b;
padding:10px;border-radius:12px;touch-action:none;user-select:none}
.c{aspect-ratio:1;border-radius:8px;background:var(--cell);display:grid;place-items:center;
font:900 clamp(22px,7vw,38px) "Arial Black",sans-serif;color:#fff;transition:background .1s}
.c.pop{animation:pop .18s ease-out}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.t2{background:#4b6584}.t4{background:#3d8f94}.t8{background:#3fae6a}.t16{background:#8bc34a;color:#1f2a37}
.t32{background:#e8c53a;color:#1f2a37}.t64{background:#f29e38}.t128{background:#ef6c45;font-size:clamp(20px,6vw,32px)}
.t256{background:#e04a5f;font-size:clamp(20px,6vw,32px)}.t512{background:#c13b8e;font-size:clamp(20px,6vw,32px)}
.t1024{background:#8a46c9;font-size:clamp(16px,5vw,26px)}.t2048{background:#ffd23f;color:#1f2a37;font-size:clamp(16px,5vw,26px)}
.big{background:#111;font-size:clamp(14px,4.4vw,22px)}
#msg{position:absolute;inset:0;border-radius:12px;background:rgba(22,32,43,.88);display:none;
flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
#msg.on{display:flex}
#msg p{font:900 32px "Arial Black",sans-serif}
.hint{margin-top:12px;font-size:13px;opacity:.7;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>2048</h1>
<div class="scores">
<div class="box"><small>Score</small><b id="score">0</b></div>
<div class="box"><small>Best</small><b id="best">0</b></div>
</div>
</header>
<div class="bar"><span>Join tiles to reach 2048.</span><button id="new">New game</button></div>
<div id="board">
<div id="msg"><p id="msgT"></p><div><button id="keep" style="display:none">Keep going</button> <button id="again">Try again</button></div></div>
</div>
<p class="hint">Arrow keys, WASD, or swipe</p>
</div>

<script>
(() => {
const N = 4;
const board = document.getElementById("board");
const cells = [];
for (let i = 0; i < N * N; i++){
const d = document.createElement("div"); d.className = "c";
board.insertBefore(d, document.getElementById("msg")); cells.push(d);
}
let grid, score, best = 0, won = false, keepPlaying = false, over = false;
try { best = parseInt(localStorage.getItem("best2048")) || 0; } catch (e) {}

function newGame(){
grid = Array.from({ length: N }, () => Array(N).fill(0));
score = 0; won = false; keepPlaying = false; over = false;
document.getElementById("msg").classList.remove("on");
spawn(); spawn(); render();
}

function spawn(){
const empty = [];
for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) empty.push([r, c]);
if (!empty.length) return null;
const [r, c] = empty[Math.floor(Math.random() * empty.length)];
grid[r][c] = Math.random() < 0.9 ? 2 : 4;
return r * N + c;
}

function slide(line){
const a = line.filter(Boolean); let gained = 0;
for (let i = 0; i < a.length - 1; i++){
if (a[i] === a[i + 1]){ a[i] *= 2; gained += a[i]; a.splice(i + 1, 1); }
}
while (a.length < N) a.push(0);
return { line: a, gained };
}

function move(dir){ // 0 left, 1 up, 2 right, 3 down
if (over) return;
let moved = false, gained = 0;
for (let i = 0; i < N; i++){
let line = [];
for (let j = 0; j < N; j++){
line.push(dir % 2 === 0 ? grid[i][dir === 0 ? j : N - 1 - j] : grid[dir === 1 ? j : N - 1 - j][i]);
}
const res = slide(line); gained += res.gained;
for (let j = 0; j < N; j++){
const v = res.line[j];
const r = dir % 2 === 0 ? i : (dir === 1 ? j : N - 1 - j);
const c = dir % 2 === 0 ? (dir === 0 ? j : N - 1 - j) : i;
if (grid[r][c] !== v){ moved = true; grid[r][c] = v; }
}
}
if (!moved) return;
score += gained;
if (score > best){
best = score;
try { localStorage.setItem("best2048", best); } catch (e) {}
}
const born = spawn();
render(born);
check();
}

function canMove(){
for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
if (!grid[r][c]) return true;
if (c < N - 1 && grid[r][c] === grid[r][c + 1]) return true;
if (r < N - 1 && grid[r][c] === grid[r + 1][c]) return true;
}
return false;
}

function check(){
if (!won && !keepPlaying && grid.some(row => row.includes(2048))){
won = true; showMsg("You made 2048!", true); return;
}
if (!canMove()){ over = true; showMsg("Game over", false); }
}

function showMsg(text, win){
document.getElementById("msgT").textContent = text;
document.getElementById("keep").style.display = win ? "inline-block" : "none";
document.getElementById("msg").classList.add("on");
}

function render(born){
for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
const v = grid[r][c], el = cells[r * N + c];
el.textContent = v || "";
el.className = "c" + (v ? " t" + v : "") + (v > 2048 ? " big" : "") + (born === r * N + c ? " pop" : "");
}
document.getElementById("score").textContent = score;
document.getElementById("best").textContent = best;
}

// keyboard
addEventListener("keydown", e => {
const map = { ArrowLeft: 0, KeyA: 0, ArrowUp: 1, KeyW: 1, ArrowRight: 2, KeyD: 2, ArrowDown: 3, KeyS: 3 };
if (e.code in map){ e.preventDefault(); if (!won || keepPlaying) move(map[e.code]); }
});

// touch swipe
let sx, sy;
board.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
board.addEventListener("touchend", e => {
if (sx == null) return;
const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
sx = null;
if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
if (won && !keepPlaying) return;
move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 2 : 0) : (dy > 0 ? 3 : 1));
}, { passive: true });

document.getElementById("new").onclick = newGame;
document.getElementById("again").onclick = newGame;
document.getElementById("keep").onclick = () => {
keepPlaying = true; document.getElementById("msg").classList.remove("on");
};

newGame();
})();
</script>
</body>
</html>
