<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snake</title>
<style>
:root {
--bg: #1d2b53; --grid: #253468; --snake: #ffec27; --head: #fff1e8;
--food: #ff004d; --text: #fff1e8; --muted: #83769c;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
background: var(--bg); color: var(--text);
font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
display: flex; flex-direction: column; align-items: center; justify-content: center;
gap: 12px; touch-action: none; user-select: none;
}
.bar { display: flex; justify-content: space-between; width: min(92vw, 420px); font-size: 16px; }
.bar span b { color: var(--snake); }
.wrap { position: relative; width: min(92vw, 420px); }
canvas { width: 100%; aspect-ratio: 1; display: block; border: 3px solid var(--muted); border-radius: 6px; background: var(--bg); }
.overlay {
position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
justify-content: center; gap: 10px; background: rgba(29,43,83,.88); text-align: center; border-radius: 6px;
}
.overlay h1 { margin: 0; font-size: 32px; color: var(--snake); }
.overlay p { margin: 0; color: var(--muted); font-size: 14px; }
button {
font: inherit; font-size: 16px; padding: 10px 22px; background: var(--snake); color: var(--bg);
border: 0; border-radius: 4px; font-weight: 700; cursor: pointer;
}
button:focus-visible { outline: 3px solid var(--head); outline-offset: 2px; }
.hidden { display: none; }
.hint { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="bar"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></div>
<div class="wrap">
<canvas id="c" width="420" height="420"></canvas>
<div class="overlay" id="overlay">
<h1 id="title">Snake</h1>
<p id="msg">Swipe or use arrow keys / WASD</p>
<button id="start">Play</button>
</div>
</div>
<div class="hint">Swipe, arrow keys, or WASD · Space pauses</div>

<script>
(() => {
const N = 21, S = 20; // grid size, cell size in px
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();

let snake, dir, nextDir, food, score, best = 0, timer, running = false, paused = false;
try { best = +localStorage.getItem('snake-best') || 0; } catch (e) {}
$('best').textContent = best;

function reset() {
snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
dir = nextDir = { x: 1, y: 0 };
score = 0; $('score').textContent = 0;
placeFood();
}

function placeFood() {
do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
while (snake.some(s => s.x === food.x && s.y === food.y));
}

function step() {
dir = nextDir;
const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
const hit = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
snake.some(s => s.x === head.x && s.y === head.y);
if (hit) return gameOver();
snake.unshift(head);
if (head.x === food.x && head.y === food.y) {
score++; $('score').textContent = score; placeFood();
clearInterval(timer); timer = setInterval(step, Math.max(60, 130 - score * 3));
} else snake.pop();
draw();
}

function draw() {
ctx.fillStyle = css('--bg'); ctx.fillRect(0, 0, cv.width, cv.height);
ctx.fillStyle = css('--grid');
for (let x = 0; x < N; x++) for (let y = 0; y < N; y++)
if ((x + y) % 2) ctx.fillRect(x * S, y * S, S, S);
ctx.fillStyle = css('--food');
ctx.beginPath(); ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S / 2 - 3, 0, 7); ctx.fill();
snake.forEach((s, i) => {
ctx.fillStyle = i ? css('--snake') : css('--head');
ctx.fillRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2);
});
}

function gameOver() {
clearInterval(timer); running = false;
if (score > best) { best = score; $('best').textContent = best; try { localStorage.setItem('snake-best', best); } catch (e) {} }
$('title').textContent = 'Game over';
$('msg').textContent = 'You scored ' + score;
$('start').textContent = 'Play again';
$('overlay').classList.remove('hidden');
}

function start() {
reset(); draw(); running = true; paused = false;
$('overlay').classList.add('hidden');
clearInterval(timer); timer = setInterval(step, 130);
}

function turn(x, y) {
if (x === -dir.x && y === -dir.y) return; // no reversing
nextDir = { x, y };
}

function togglePause() {
if (!running) return;
paused = !paused;
if (paused) { clearInterval(timer); $('title').textContent = 'Paused'; $('msg').textContent = ''; $('start').textContent = 'Resume'; $('overlay').classList.remove('hidden'); }
else { $('overlay').classList.add('hidden'); timer = setInterval(step, Math.max(60, 130 - score * 3)); }
}

$('start').addEventListener('click', () => paused ? togglePause() : start());

addEventListener('keydown', e => {
const k = e.key.toLowerCase();
const map = { arrowup: [0,-1], w: [0,-1], arrowdown: [0,1], s: [0,1], arrowleft: [-1,0], a: [-1,0], arrowright: [1,0], d: [1,0] };
if (map[k]) { e.preventDefault(); if (running && !paused) turn(...map[k]); }
else if (k === ' ') { e.preventDefault(); running ? togglePause() : start(); }
});

// Swipe controls
let t0 = null;
addEventListener('touchstart', e => { t0 = e.touches[0]; }, { passive: true });
addEventListener('touchend', e => {
if (!t0 || !running || paused) return;
const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
t0 = null;
});

reset(); draw();
})();
</script>
</body>
</html>
